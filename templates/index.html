<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Poliçe Chatbot</title>
  <link rel="stylesheet" href="/static/css/style.css?v=3">
</head>
<body>

  <!-- Poliçe Giriş Kutusu -->
  <div class="policy-box" id="policy-box">
    <h2>Poliçe Numaranızı Girin</h2>

    <!-- Enter ile çalışması için form eklendi -->
    <form id="policy-form" style="display:flex; flex-direction:column; gap:12px;">
      <input
        type="text"
        id="policy-number"
        placeholder="Örn: P123456789"
        autocomplete="off"
      >
      <!-- Enter submit'i yakalansın diye type=submit -->
      <button type="submit">Başla</button>
    </form>

    <div id="loading" class="loading" style="display: none;">
      <div class="spinner"></div>
      <p>Poliçe işleniyor, lütfen bekleyin...</p>
    </div>
  </div>

  <!-- Chat Kutusu -->
  <div class="chat-container" id="chat-container" style="display: none;">
    <div class="chat-box" id="chat-box"></div>
    <div class="input-area">
      <textarea id="prompt" rows="1" placeholder="Bir şeyler yaz..." onkeydown="handleEnter(event)"></textarea>
      <button onclick="sendPrompt()">Gönder</button>
    </div>
  </div>

  <!-- Yeni Poliçe Butonu (inline onclick ile garantili) -->
  <button id="new-policy-btn" class="floating-action" aria-label="Yeni Poliçe" style="display:none;" title="Yeni Poliçe" onclick="resetPolicy()">
    Yeni Poliçe
  </button>

  <!-- JS cache-bust: v=4 (patch'in kesin yüklenmesi için) -->
  <script src="/static/js/chat.js?v=5"></script>
</body>
</html>
