<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Poliçe Chatbot</title>
  <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body>

  <!-- Poliçe / Hasar Giriş Kutusu -->
  <div class="policy-box" id="policy-box">
    <h2>Poliçe / Hasar Dosya Bilgilerinizi Girin</h2>

    <!-- Form -->
    <form id="policy-form" onsubmit="event.preventDefault(); submitPolicy();">
      <div class="policy-inputs">
        <input
          type="text"
          id="policy-number"
          name="policy_number"
          placeholder="Örn: P123456789"
          autocomplete="on"
        >
        <input
          type="text"
          id="claim-number"
          name="claim_number"
          placeholder="Örn: H123456789"
          autocomplete="on"
        >
      </div>
      <button type="submit">Başla</button>
    </form>

    <div id="loading" class="loading" style="display: none;">
      <div class="spinner"></div>
      <p>Bilgiler işleniyor, lütfen bekleyin...</p>
    </div>
  </div>

  <!-- Chat Kutusu -->
  <div class="chat-container" id="chat-container" style="display: none;">
    <div class="chat-box" id="chat-box"></div>
    <div class="input-area">
      <textarea id="prompt" rows="1" placeholder="Bir şeyler yaz..." onkeydown="handleEnter(event)"></textarea>
      <button onclick="sendPrompt()">Gönder</button>
    </div>
  </div>

  <!-- Yeni Poliçe Butonu -->
  <button id="new-policy-btn" class="floating-action" aria-label="Yeni Poliçe"
          style="display:none;" title="Yeni Poliçe" onclick="resetPolicy()">
    Yeni Poliçe
  </button>

  <!-- JS cache-bust -->
  <script src="/static/js/chat.js?v=6"></script>
</body>
</html>
